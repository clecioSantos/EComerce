name: Security and consistency checks

on:
  push:
    branches:
      - feature/agente-vendas-v1
      - main
  pull_request:

permissions:
  contents: read

jobs:
  store:
    name: Store typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
      - run: node --check server.mjs
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm test
  agent:
    name: Sales agent types and security tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
